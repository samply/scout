[package]
name = "scout"
version = "0.1.0"
authors = ["Tim Schumacher <tim.schumacher@dkfz-heidelberg.de>"]
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
dioxus = { version = "0.7.2", features = ["router", "fullstack"] }
itertools = "0.14.0"
jiff = { version = "0.2.15", features = ["js", "serde"] }
reqwest = { version = "0.12.24", features = ["json"] }
serde = "1.0.219"
serde_json = "1.0.145"
toml = "0.9.8"
tracing = "0.1.41"
axum = { version = "0.8.7", optional = true }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server", "axum", "tokio"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
